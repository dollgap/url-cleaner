<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>링크 깔끔이 · URL 추적 꼬리표 제거</title>
<meta name="description" content="인스타·스레드는 사진 번호 외 추적 꼬리표를 전부, 쿠팡·유튜브·네이버 공유 링크는 igsh·utm_source 같은 추적 꼬리표를 잘라내고 원본 주소만 복사해 주는 오프라인 웹앱">
<meta name="theme-color" content="#080d14">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="링크 깔끔이">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080d14'/%3E%3Cpath d='M26 38l12-12' stroke='%2352b8ff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M23 30l-4 4a8 8 0 0011 11l4-4' stroke='%2352b8ff' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M41 34l4-4a8 8 0 00-11-11l-4 4' stroke='%2352b8ff' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#080d14; --bg-soft:#0e1622; --panel:#121b26; --panel2:#17222f; --line:#243343;
  --text:#e8eef6; --muted:#8b9aac; --dim:#606e7d;
  --accent:#52b8ff; --accent-deep:#2b8fe0; --accent-ink:#03192e;
  --ok:#3ddc97; --ok-bg:rgba(61,220,151,.12); --ok-line:rgba(61,220,151,.32);
  --warn:#ffb443; --warn-bg:rgba(255,180,67,.13); --warn-line:rgba(255,180,67,.32);
  --radius:18px;
  --safe-b:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--text); min-height:100vh; min-height:100svh;
  background:radial-gradient(1100px 520px at 50% -10%, #16273a 0%, rgba(8,13,20,0) 62%), var(--bg);
  background-attachment:fixed;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Liberation Sans",sans-serif;
  font-size:15px; line-height:1.45; letter-spacing:-.01em;
  display:flex; flex-direction:column; overscroll-behavior-y:none;
}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
h1,h2,h3,p,ul{margin:0; padding:0}
ul{list-style:none}
code{font-family:ui-monospace,SFMono-Regular,Menlo,"Droid Sans Mono",monospace; font-size:.92em;
  background:rgba(255,255,255,.07); padding:1px 5px; border-radius:5px; color:#cfe4f7}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:rgba(8,13,20,.82); backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid rgba(36,51,67,.65);
}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.mark{width:32px; height:32px; display:grid; place-items:center; flex:0 0 auto; border-radius:10px;
  background:linear-gradient(160deg,#1b2a3a,#121b26); border:1px solid var(--line)}
.mark svg{width:19px; height:19px; display:block}
.brand-txt{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.brand-txt strong{font-size:15px; font-weight:700; letter-spacing:-.02em; white-space:nowrap}
.brand-txt small{font-size:11px; color:var(--muted); letter-spacing:0; white-space:nowrap}
.ghost-sm{font-size:12.5px; font-weight:600; color:var(--muted); padding:8px 11px; border-radius:10px;
  border:1px solid var(--line); background:rgba(255,255,255,.02)}
.ghost-sm:active{background:rgba(255,255,255,.07); color:var(--text)}

/* ---------- layout ---------- */
main{width:100%; max-width:480px; margin:0 auto; padding:18px 16px calc(26px + var(--safe-b)); flex:1 1 auto}

/* ---------- hero ---------- */
.hero h2{font-size:23px; line-height:1.34; font-weight:700; letter-spacing:-.035em}
.hero h2 b{color:var(--accent); font-weight:700}
.hero p{margin-top:9px; color:var(--muted); font-size:13px; line-height:1.55}

/* ---------- input card ---------- */
.inputcard{margin-top:16px; border-radius:20px; padding:12px; background:linear-gradient(180deg,#131d29,#101822);
  border:1px solid var(--line); box-shadow:0 12px 30px rgba(0,0,0,.28)}
#raw{
  width:100%; min-height:104px; max-height:220px; resize:none; display:block;
  padding:13px 13px; border-radius:14px; border:1px solid rgba(36,51,67,.9);
  background:#0a121b; color:var(--text); font-family:inherit; font-size:14px; line-height:1.55;
  letter-spacing:-.005em; outline:none; word-break:break-all; -webkit-user-select:text; user-select:text;
}
#raw::placeholder{color:#5b6a7a}
#raw:focus{border-color:rgba(82,184,255,.55); box-shadow:0 0 0 3px rgba(82,184,255,.12)}
.inputrow{display:flex; gap:8px; margin-top:10px}
.btn{min-height:50px; border-radius:14px; font-size:15px; font-weight:700; letter-spacing:-.02em;
  display:flex; align-items:center; justify-content:center; gap:7px; transition:transform .1s, filter .15s, background .15s}
.btn svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.btn:active{transform:scale(.98)}
.btn.primary{flex:1 1 auto; background:linear-gradient(180deg,var(--accent),var(--accent-deep)); color:var(--accent-ink);
  box-shadow:0 6px 18px rgba(82,184,255,.22)}
.btn.primary:active{filter:brightness(.95)}
.btn.soft{flex:0 0 auto; min-width:88px; padding:0 16px; background:#1b2733; color:#dce7f3; border:1px solid var(--line)}
.btn.ghost{flex:0 0 auto; min-width:96px; padding:0 14px; background:rgba(255,255,255,.045); color:#dbe6f2; border:1px solid var(--line)}
.btn[disabled]{opacity:.5}
.btn.copied{background:linear-gradient(180deg,var(--ok),#25b87c); color:#04241a; box-shadow:0 6px 18px rgba(61,220,151,.2)}

.examples{margin-top:11px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.ex-label{font-size:11px; color:var(--dim); font-weight:600; margin-right:2px}
.ex{font-size:12px; font-weight:600; color:#b9c9da; padding:6px 10px; border-radius:9px;
  background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.07)}
.ex:active{background:rgba(82,184,255,.16); color:#dff1ff; border-color:rgba(82,184,255,.4)}

/* ---------- results ---------- */
#results{margin-top:16px; display:flex; flex-direction:column; gap:11px}
.summary{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 2px}
.summary .s-tx{font-size:12.5px; color:var(--muted); font-weight:600}
.summary .s-tx b{color:var(--text)}
.summary button{font-size:12px; font-weight:700; color:var(--accent); padding:6px 10px; border-radius:9px;
  background:rgba(82,184,255,.1); border:1px solid rgba(82,184,255,.28)}

.card{border-radius:var(--radius); padding:14px 14px 13px; border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel2),var(--panel)); animation:rise .22s ease both}
@keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.card.clean{border-color:var(--ok-line); background:linear-gradient(180deg,rgba(61,220,151,.09),rgba(61,220,151,.02))}
.card.shortlink{border-color:var(--warn-line); background:linear-gradient(180deg,rgba(255,180,67,.09),rgba(255,180,67,.02))}
.card-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:9px}
.site{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; letter-spacing:.01em;
  padding:4px 9px; border-radius:999px; background:rgba(82,184,255,.13); color:#9dd6ff; border:1px solid rgba(82,184,255,.3)}
.site .dot{width:6px; height:6px; border-radius:50%; background:var(--accent)}
.delta{margin-left:auto; font-size:11.5px; font-weight:700; color:var(--ok); font-variant-numeric:tabular-nums}
.card.clean .delta{color:var(--ok)}
.delta.muted{color:var(--muted)}
.out{
  display:block; width:100%; padding:12px 13px; border-radius:13px; background:#08121b;
  border:1px solid rgba(60,86,110,.55); color:#eaf4ff;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
  font-size:13.5px; line-height:1.55; word-break:break-all; -webkit-user-select:all; user-select:all;
  max-height:132px; overflow-y:auto;
}
.card.clean .out{border-color:rgba(61,220,151,.3)}
.removed{margin-top:10px; display:flex; align-items:flex-start; gap:6px; flex-wrap:wrap}
.rl{font-size:10.5px; font-weight:800; letter-spacing:.02em; color:#ff9d9d; background:rgba(255,120,120,.12);
  border:1px solid rgba(255,120,120,.3); padding:4px 8px; border-radius:7px; flex:0 0 auto; margin-top:1px}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; padding:4px 8px; border-radius:7px;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); color:#cfdae6; max-width:100%}
.chip .k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#ffc9c9;
  text-decoration:line-through; text-decoration-color:rgba(255,140,140,.7); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kept{margin-top:9px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.kl{font-size:10.5px; font-weight:800; letter-spacing:.02em; color:#9dd6ff; background:rgba(82,184,255,.12);
  border:1px solid rgba(82,184,255,.3); padding:4px 8px; border-radius:7px}
.chip.keep .k{color:#c9e7ff; text-decoration:none}
.chip.more{border-style:dashed; color:var(--muted)}
.chip.more .k{color:var(--muted); text-decoration:none}
.note{margin-top:9px; font-size:11.5px; line-height:1.5; color:var(--muted); padding:9px 10px; border-radius:10px;
  background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.06)}
.note.warn{color:#ffd9a3; background:var(--warn-bg); border-color:var(--warn-line)}
.note.ok{color:#a9eccd; background:var(--ok-bg); border-color:var(--ok-line)}
.note b{color:inherit; font-weight:700}
.card-actions{display:flex; gap:8px; margin-top:11px}
.multi-note{font-size:12px; color:var(--muted); padding:2px 4px}

/* ---------- options ---------- */
.options{margin-top:22px}
.options h3{font-size:12px; font-weight:800; letter-spacing:.03em; color:var(--dim); text-transform:uppercase; padding:0 2px 8px}
.switchrow{display:flex; align-items:center; gap:12px; padding:12px 13px; border-radius:14px; margin-bottom:8px;
  background:var(--panel); border:1px solid var(--line); cursor:pointer}
.switchrow:active{background:var(--panel2)}
.sw-txt{display:flex; flex-direction:column; gap:3px; flex:1 1 auto; min-width:0}
.sw-txt strong{font-size:13.5px; font-weight:700; letter-spacing:-.02em}
.sw-txt small{font-size:11.5px; color:var(--muted); line-height:1.45}
.sw{position:relative; flex:0 0 auto; width:46px; height:28px; border-radius:99px; background:#233241;
  border:1px solid #2f4052; transition:background .18s, border-color .18s}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
  background:#9fb0c2; transition:transform .18s, background .18s}
.switchrow input{position:absolute; opacity:0; width:0; height:0}
.switchrow input:checked + .sw{background:rgba(82,184,255,.32); border-color:rgba(82,184,255,.75)}
.switchrow input:checked + .sw::after{transform:translateX(18px); background:#eaf6ff}
.switchrow input:focus-visible + .sw{box-shadow:0 0 0 3px rgba(82,184,255,.28)}

/* ---------- footer ---------- */
.foot{margin-top:22px; padding:0 2px}
.foot p{font-size:11.5px; line-height:1.6; color:var(--dim)}
.foot .privacy{color:#93a6b9}
.foot .offline{margin-top:6px}
.foot .credit{margin-top:12px; color:#485565; font-size:10.5px}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); transform:translate(-50%,16px);
  z-index:80; max-width:calc(100% - 40px); padding:11px 16px; border-radius:12px;
  background:rgba(22,32,44,.97); border:1px solid #2b3d50; color:#eaf3fb; font-size:13px; font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
  text-align:center; backdrop-filter:blur(8px);
}
.toast.show{opacity:1; transform:translate(-50%,0)}
@media (max-width:359px){
  main{padding-left:12px; padding-right:12px}
  .hero h2{font-size:21px}
  .btn{font-size:14px}
  .btn.soft{min-width:74px; padding:0 12px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#52b8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 14.5l5-5"/>
        <path d="M8.2 11.2l-1.9 1.9a4 4 0 005.7 5.7l1.9-1.9"/>
        <path d="M15.8 12.8l1.9-1.9a4 4 0 00-5.7-5.7l-1.9 1.9"/>
      </svg>
    </span>
    <span class="brand-txt"><strong>링크 깔끔이</strong><small>URL 추적 꼬리표 제거</small></span>
  </div>
  <button class="ghost-sm" id="btnOptions" type="button">설정</button>
</header>

<main>
  <section class="hero">
    <h2>붙여넣으면 <b>추적 꼬리표</b>만<br>싹 잘라냅니다</h2>
    <p>인스타·스레드는 사진 번호(<code>img_index</code>)만 남기고 <code>lqvp</code>, <code>igsh</code> 같은 추적 꼬리표를 <b>전부</b> 지우며, 쿠팡·유튜브·네이버 공유 링크의 <code>utm_source</code> 같은 값도 잘라내요.</p>
  </section>

  <section class="inputcard">
    <label class="sr-only" for="raw">링크 붙여넣기</label>
    <textarea id="raw" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off"
      placeholder="여기에 링크를 붙여넣으세요&#10;공유 문구가 섞여 있어도 괜찮아요"></textarea>
    <div class="inputrow">
      <button class="btn primary" id="btnPaste" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1.2"/><path d="M16 5h2a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h2"/></svg>
        붙여넣기 &amp; 바로 정리
      </button>
      <button class="btn soft" id="btnClean" type="button">정리</button>
    </div>
    <div class="examples" id="examples">
      <span class="ex-label">예시</span>
      <button class="ex" type="button" data-ex="ig">인스타</button>
      <button class="ex" type="button" data-ex="th">스레드</button>
      <button class="ex" type="button" data-ex="cp">쿠팡</button>
      <button class="ex" type="button" data-ex="yt">유튜브</button>
    </div>
  </section>

  <section id="results" aria-live="polite"></section>

  <section class="options" id="options">
    <h3>세부 설정</h3>
    <label class="switchrow">
      <span class="sw-txt">
        <strong>쿠팡 옵션(itemId)도 함께 지우기</strong>
        <small>기본은 상품 옵션을 살려 둡니다. 켜면 itemId·vendorItemId까지 지워요.</small>
      </span>
      <input type="checkbox" id="optItemId">
      <span class="sw" aria-hidden="true"></span>
    </label>
    <label class="switchrow">
      <span class="sw-txt">
        <strong>유튜브 재생 위치(t=) 유지</strong>
        <small>끄면 특정 시점부터 재생하는 값도 지웁니다.</small>
      </span>
      <input type="checkbox" id="optTs" checked>
      <span class="sw" aria-hidden="true"></span>
    </label>
  </section>

  <footer class="foot">
    <p class="privacy">🔒 링크는 서버로 전송되지 않습니다. 잘라내기도 복사도 이 기기 브라우저 안에서만 이뤄져요.</p>
    <p class="offline">📲 홈 화면에 추가하면 앱처럼 바로 열립니다 · 인터넷이 없어도 동작해요</p>
    <p class="credit">사진 정보 지우개와 같은 손으로 만든 작은 도구 · 링크 깔끔이</p>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     추적 파라미터 정의
     - UNIVERSAL: 어느 사이트에서나 확실히 추적용인 값
     - SITE 규칙: 특정 서비스에서만 의미가 갈리는 값
     ============================================================ */

  var UNIVERSAL_EXACT = [
    'fbclid', 'gclid', 'gbraid', 'wbraid', 'dclid', 'yclid', 'msclkid', 'twclid', 'ttclid',
    'li_fat_id', 'mc_cid', 'mc_eid', 'mkt_tok', '_hsenc', '_hsmi', '_ga', '_gl', 'vero_id',
    'wickedid', 's_kwcid', 'ef_id', 'epik', 'irclickid', 'rb_clickid', 'igshid', 'igsh',
    'spm', 'scm', 'ref_src', 'ref_url', 'cmpid', 'campaignid', 'adid', 'ad_id', 'clickid',
    'click_id', 'trkid', 'trk', 'trackingid', 'oly_anon_id', 'oly_enc_id', 'icid', 'ncid',
    'mkt', 'elqTrack', 'elqTrackId', 'assetType', 'assetId'
  ];
  var UNIVERSAL_PREFIX = ['utm_', 'aff_', 'aff-', 'mtm_', 'pk_campaign', 'pk_kwd', 'hsa_', 'share_', 'sc_' , 'elqtrack'];

  // 긴 URL 줄에서 실제로 보이는 이름 그대로 쓰기 위해 소문자 비교
  var UNIV = {}, UNIV_PREFIX = UNIVERSAL_PREFIX.map(function (p) { return p.toLowerCase(); });
  UNIVERSAL_EXACT.forEach(function (k) { UNIV[k.toLowerCase()] = 1; });

  var SITES = [
    {
      // 인스타는 이름을 알 수 없는 공유 꼬리표(lqvp 등)가 계속 새로 생겨서
      // 블랙리스트 대신 화이트리스트로 처리한다. 남기는 건 사진 번호뿐.
      id: 'instagram', label: '인스타그램',
      test: /^(?:[a-z0-9-]+\.)*(?:instagram\.com|instagr\.am|ddinstagram\.com)$/,
      mode: 'whitelist',
      allow: ['img_index'],
      allowQueryOnSearch: ['q', 'query']
    },
    {
      // 스레드도 같은 이유로 전부 지우고, 검색 경로의 검색어만 살린다.
      id: 'threads', label: '스레드',
      test: /^(?:[a-z0-9-]+\.)*threads\.(?:net|com)$/,
      mode: 'whitelist',
      allow: [],
      allowQueryOnSearch: ['q', 'query']
    },
    {
      id: 'coupang', label: '쿠팡',
      test: /^(?:[a-z0-9-]+\.)*coupang\.com$/,
      drop: ['src', 'spec', 'addtag', 'ctag', 'lptag', 'itime', 'pagetype', 'pagevalue',
        'wpcid', 'wref', 'wtime', 'redirect', 'mcid', 'sharesource', 'style', 'isaddedcart',
        'rank', 'searchid', 'q', 'subid', 'traid', 'tduid', 'sourcetype', 'clickeventreferrer',
        'clickeventplatform', 'clickeventname', 'clickeventvalue', 'eventcategory', 'eventlabel',
        'impressionid', 'requestid', 'vendorid', 'isshortened', 'traceid', 'trace_id', 'isaddedcart'],
      dropPrefix: ['clickevent', 'event', 'utm_'],
      keep: ['itemid', 'vendoritemid'],
      override: function (key, ctx) {

  /* 단축·리다이렉트 링크: 브라우저에서 열기 전엔 최종 주소를 알 수 없다 */
  var SHORT_HOSTS = [
    'link.coupang.com', 'coupa.ng', 'bit.ly', 'bitly.com', 't.co', 'tinyurl.com',
    'goo.gl', 'han.gl', 'url.kr', 'vo.la', 'me2.do', 'ozalink.kr', 'lkt.ly', 'buly.kr',
    'naver.me', 'abr.ge', 'mtool.naver.com', 'link.naver.com', 'kko.to', 'urlz.kr'
  ];

  /* ============================================================
     정리 엔진
     ============================================================ */

  function siteRule(host) {
    host = String(host || '').toLowerCase().replace(/\.$/, '');
    for (var i = 0; i < SITES.length; i++) {
      if (SITES[i].test.test(host)) return SITES[i];
    }
    return null;
  }

  function isShortHost(host) {
    host = String(host || '').toLowerCase();
    for (var i = 0; i < SHORT_HOSTS.length; i++) {
      if (host === SHORT_HOSTS[i] || host.slice(-(SHORT_HOSTS[i].length + 1)) === '.' + SHORT_HOSTS[i]) return true;
    }
    return false;
  }

  function safeDecode(s) {
    try { return decodeURIComponent(String(s).replace(/\+/g, ' ')); }
    catch (e) { return String(s); }
  }

  function normalizeInput(raw) {
    var s = String(raw || '').trim();
    if (!s) return '';
    // 괄호·마침표 등 문장부호가 붙어 들어온 경우 제거
    s = s.replace(/^[<(\["'“‘]+/, '').replace(/[\])>,.;:!?"'”’…。、]+$/, '');
    if (/^\/\//.test(s)) s = 'https:' + s;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'https://' + s;
    return s;
  }

  function analyzeUrl(rawInput, opts) {
    opts = opts || {};
    var out = {
      ok: false, input: String(rawInput || ''), url: '', host: '', site: '', siteId: '',
      removed: [], kept: [], changed: false, short: false, invalid: true, note: ''
    };

    var prev = normalizeInput(rawInput);
    if (!prev) return out;

    var u;
    try { u = new URL(prev); } catch (e) { return out; }
    if (!/^https?:$/.test(u.protocol)) return out;
    if (!u.hostname || u.hostname.indexOf('.') === -1) return out;

    out.ok = true;
    out.invalid = false;

    var rule = siteRule(u.hostname);
    out.siteId = rule ? rule.id : 'generic';
    out.site = rule ? rule.label : '기타 사이트';
    out.host = u.hostname;
    out.short = isShortHost(u.hostname);

    var dropExact = {};
    for (var k in UNIV) dropExact[k] = 1;
    var dropPrefix = UNIV_PREFIX.slice();
    var keepExact = {};

    if (rule) {
      (rule.drop || []).forEach(function (x) { dropExact[String(x).toLowerCase()] = 1; });
      (rule.dropPrefix || []).forEach(function (x) { dropPrefix.push(String(x).toLowerCase()); });
      (rule.keep || []).forEach(function (x) { keepExact[String(x).toLowerCase()] = 1; });
    }

    // 사용자 선택: 쿠팡 옵션 ID까지 제거
    if (rule && rule.id === 'coupang' && opts.dropItemIds) {
      dropExact['itemid'] = 1;
      dropExact['vendoritemid'] = 1;
      delete keepExact['itemid'];
      delete keepExact['vendoritemid'];
    }
    // 사용자 선택: 유튜브 타임스탬프까지 제거 (기본값은 유지)
    if (rule && rule.id === 'youtube' && opts.keepTs === false) {
      dropExact['t'] = 1;
      delete keepExact['t'];
    }

    var ctx = { path: u.pathname || '/', search: u.search || '', host: u.hostname, hasItemId: /[?&]itemId=/i.test(u.search || '') };

    // 화이트리스트 규칙(인스타·스레드): allow 목록에 없는 쿼리는 이름과 상관없이 전부 지운다.
    var allowAlways = null, allowOnSearch = null, allowSearchPath = false;
    if (rule && rule.mode === 'whitelist') {
      allowAlways = {};
      allowOnSearch = {};
      (rule.allow || []).forEach(function (x) {
        var k = String(x).toLowerCase();
        allowAlways[k] = 1;
        keepExact[k] = 1;
      });
      (rule.allowQueryOnSearch || []).forEach(function (x) { allowOnSearch[String(x).toLowerCase()] = 1; });
      allowSearchPath = /(?:^|\/)search(?:\/|$)/i.test(ctx.path);
    }

    // --- 쿼리 파라미터 ---
    var qRaw = u.search ? u.search.replace(/^\?/, '') : '';
    var parts = qRaw ? qRaw.split('&') : [];
    var keptParts = [];
    var removed = [];
    var keptSpecial = [];
    var seenRemoved = {};

    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (!part) continue;
      var eq = part.indexOf('=');
      var rawKey = eq >= 0 ? part.slice(0, eq) : part;
      var key = safeDecode(rawKey).trim();
      var low = key.toLowerCase();
      var val = eq >= 0 ? safeDecode(part.slice(eq + 1)) : '';

      var drop = false;
      if (allowAlways) {
        // 허용 목록에 있는 이름만 통과, 나머지는 무조건 제거
        drop = !(allowAlways[low] || (allowSearchPath && allowOnSearch[low]));
      } else {
        if (dropExact[low]) drop = true;
        else {
          for (var p = 0; p < dropPrefix.length; p++) {
            if (low.indexOf(dropPrefix[p]) === 0) { drop = true; break; }
          }
        }
        if (keepExact[low]) drop = false;
        if (rule && typeof rule.override === 'function') {
          var opinion = rule.override(low, ctx);
          if (opinion === true) drop = false;
          else if (opinion === false) drop = true;
        }
      }

      if (drop) {
        if (!seenRemoved[low]) {
          seenRemoved[low] = 1;
          removed.push({ key: key, value: val });
        }
      } else {
        keptParts.push(part);
        if ((keepExact[low] || (allowSearchPath && allowOnSearch && allowOnSearch[low])) && !seenRemoved[low]) {
          keptSpecial.push({ key: key, value: val });
          seenRemoved[low] = 1;
        }
      }
    }

    // --- 경로 정리 (아마존 /ref=...) ---
    var path = u.pathname || '/';
    if (rule && rule.id === 'amazon') {
      var segs = path.split('/').filter(function (seg) { return seg && !/^ref(=|_|$)/i.test(seg); });
      path = '/' + segs.join('/');
      if (path === '/') path = '/';
    }

    // --- 해시 정리 ---
    var hash = u.hash || '';
    if (hash && /^#(?:utm_|igsh|fbclid|spm)/i.test(hash)) hash = '';

    var built = u.protocol + '//' + u.host + path +
      (keptParts.length ? '?' + keptParts.join('&') : '') + hash;

    out.url = built;
    out.removed = removed;
    out.kept = keptSpecial;
    out.changed = built !== String(rawInput).trim();

    if (out.short) {
      out.note = '단축·추적 링크는 열기 전엔 최종 주소를 알 수 없어요. 브라우저에서 먼저 연 뒤 주소창의 긴 주소를 복사해 붙여넣으면 똑같이 정리됩니다.';
    } else if (!removed.length) {
      out.note = '이미 깔끔한 링크예요. 지울 꼬리표가 없습니다.';
    }
    return out;
  }

  /* ---------- 입력에서 URL 뽑아내기 ---------- */

  var TLD = ('com|net|org|kr|co\\.kr|or\\.kr|go\\.kr|ac\\.kr|ne\\.kr|io|me|ly|to|us|so|app|link|shop|store|tv|be|am|gl|gg|cc|xyz|site|online|jp|cn|ru|de|fr|uk|au|in|vn|th|id|ph|info|biz|top|club|live|news|page|dev|ai');
  var DOMAIN_RE = new RegExp('(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\\.)+(?:' + TLD + ')(?::\\d{2,5})?(?:\\/[^\\s<>"\'`\\u3000\\u00a0]*)?', 'gi');
  var SCHEME_RE = /https?:\/\/[^\s<>"'`\u3000\u00a0]+/gi;

  function cleanToken(t) {
    var s = String(t || '').replace(/^[<(\["'“‘]+/, '');
    // 끝에 붙은 문장부호만 제거 (URL 마지막 ')'는 살린다)
    var trailing = /[.,;:!?"'”’…。、]+$/;
    s = s.replace(trailing, '');
    if (/\)$/.test(s) && (s.match(/\(/g) || []).length < (s.match(/\)/g) || []).length) {
      s = s.replace(/\)+$/, '');
    }
    return s;
  }

  function extractUrls(text) {
    text = String(text || '');
    var cands = [];
    var m;
    var schemeSpans = [];

    // 1) http(s):// 가 붙은 링크
    SCHEME_RE.lastIndex = 0;
    while ((m = SCHEME_RE.exec(text)) !== null) {
      cands.push({ i: m.index, t: m[0] });
      schemeSpans.push([m.index, m.index + m[0].length]);
    }

    // 2) 스킴 없이 붙여넣은 링크 (instagram.com/reel/…) — 이미 찾은 링크 안쪽은 건너뛴다
    DOMAIN_RE.lastIndex = 0;
    while ((m = DOMAIN_RE.exec(text)) !== null) {
      var s = m.index;
      var inside = false;
      for (var i = 0; i < schemeSpans.length; i++) {
        if (s >= schemeSpans[i][0] && s < schemeSpans[i][1]) { inside = true; break; }
      }
      if (!inside) cands.push({ i: s, t: m[0] });
    }

    cands.sort(function (a, b) { return a.i - b.i; });

    var found = [];
    var seen = {};
    for (var c = 0; c < cands.length; c++) {
      var tok = cleanToken(cands[c].t);
      if (!tok) continue;
      var hostPart = tok.replace(/^[a-z][a-z0-9+.-]*:\/\//i, '').split('/')[0];
      if (!/\./.test(hostPart)) continue;
      var key = tok.toLowerCase().replace(/^https?:\/\//, '').replace(/\/$/, '');
      if (seen[key]) continue;
      seen[key] = 1;
      found.push(tok);
      if (found.length >= 12) break;
    }
    return found;
  }

  /* ============================================================
     UI
     ============================================================ */

  var $ = function (sel) { return document.querySelector(sel); };
  var rawEl = $('#raw');
  var resultsEl = $('#results');
  var toastEl = $('#toast');
  var toastTimer = null;
  var lastResults = [];

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function shortVal(v) {
    v = String(v || '');
    if (v.length <= 18) return v;
    return v.slice(0, 15) + '…';
  }

  function currentOpts() {
    var a = $('#optItemId');
    var b = $('#optTs');
    return { dropItemIds: !!(a && a.checked), keepTs: b ? !!b.checked : true };
  }

  function copyText(text) {
    return new Promise(function (resolve) {
      var done = function (ok) { resolve(ok); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
      } else {
        done(fallbackCopy(text));
      }
    });
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand('copy');
    } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function shareText(url) {
    if (navigator.share) {
      navigator.share({ title: '깔끔한 링크', text: url }).catch(function () {});
    } else {
      copyText(url).then(function (ok) {
        toast(ok ? '공유 기능이 없어 복사했어요' : '복사에 실패했어요');
      });
    }
  }

  function renderCard(r, idx) {
    var origLen = r.input.trim().length;
    var newLen = r.url.length;
    var diff = origLen - newLen;
    var cls = 'card';
    if (r.short) cls += ' shortlink';
    else if (r.ok && !r.removed.length) cls += ' clean';

    var delta;
    if (!r.ok) delta = '<span class="delta muted">주소 아님</span>';
    else if (r.removed.length) {
      delta = '<span class="delta">' + origLen + '자 → ' + newLen + '자 (−' + Math.max(diff, 0) + ')</span>';
    } else {
      delta = '<span class="delta muted">' + newLen + '자 · 그대로</span>';
    }

    var chips = '';
    if (r.removed.length) {
      var shown = r.removed.slice(0, 8);
      var rest = r.removed.length - shown.length;
      chips = '<div class="removed"><span class="rl">제거됨</span>' +
        shown.map(function (x) {
          var label = x.value ? x.key + '=' + shortVal(x.value) : x.key;
          return '<span class="chip" title="' + esc(label) + '"><span class="k">' + esc(label) + '</span></span>';
        }).join('') +
        (rest > 0 ? '<span class="chip more"><span class="k">+' + rest + '개 더</span></span>' : '') +
        '</div>';
    }
    if (r.kept && r.kept.length) {
      chips += '<div class="kept"><span class="kl">유지</span>' +
        r.kept.map(function (x) {
          var label = x.value ? x.key + '=' + shortVal(x.value) : x.key;
          return '<span class="chip keep"><span class="k">' + esc(label) + '</span></span>';
        }).join('') + '</div>';
    }

    var note = '';
    if (r.note) {
      var ncls = 'note';
      if (r.short) ncls += ' warn';
      else if (!r.removed.length && !r.invalid) ncls += ' ok';
      note = '<div class="' + ncls + '">' + esc(r.note) + '</div>';
    }

    var body;
    if (r.ok) {
      body =
        '<div class="out" data-url="' + esc(r.url) + '">' + esc(r.url) + '</div>' +
        chips + note +
        '<div class="card-actions">' +
          '<button class="btn primary" type="button" data-copy="' + idx + '">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M15 5.5A2.5 2.5 0 0012.5 3H6a2.5 2.5 0 00-2.5 2.5V12"/></svg>' +
            '깨끗한 링크 복사' +
          '</button>' +
          '<button class="btn ghost" type="button" data-share="' + idx + '" aria-label="공유하기">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M5 14v5a2 2 0 002 2h10a2 2 0 002-2v-5"/></svg>' +
            '공유' +
          '</button>' +
        '</div>';
    } else {
      body = '<div class="note warn">링크로 읽을 수 없는 값이에요. 주소를 다시 확인해 주세요.</div>';
    }

    return '<article class="' + cls + '">' +
      '<div class="card-head">' +
        '<span class="site"><span class="dot"></span>' + esc(r.ok ? r.site : '알 수 없음') + '</span>' +
        delta +
      '</div>' + body + '</article>';
  }

  function render(results) {
    lastResults = results;
    var okOnes = results.filter(function (r) { return r.ok; });
    var html = '';
    if (results.length > 1) {
      html += '<div class="summary"><span class="s-tx">링크 <b>' + okOnes.length + '개</b> 정리됨</span>' +
        '<button type="button" id="btnCopyAll">전체 복사</button></div>';
    }
    html += results.map(renderCard).join('');
    resultsEl.innerHTML = html;
    resultsEl.setAttribute('data-count', String(results.length));
  }

  function runClean(silent) {
    var text = rawEl.value;
    var urls = extractUrls(text);
    if (!urls.length) {
      if (!silent) toast(text.trim() ? '링크를 찾지 못했어요' : '먼저 링크를 붙여넣어 주세요');
      resultsEl.innerHTML = '';
      lastResults = [];
      return;
    }
    var opts = currentOpts();
    var results = urls.map(function (u) { return analyzeUrl(u, opts); });
    render(results);
    if (!silent) {
      var removed = results.reduce(function (n, r) { return n + r.removed.length; }, 0);
      if (removed) toast('꼬리표 ' + removed + '개를 잘라냈어요');
    }
    // 결과가 화면 밖이면 살짝 끌어온다
    var first = resultsEl.querySelector('.card');
    if (first && !silent) {
      try { first.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
    }
  }

  /* ---------- 이벤트 ---------- */

  resultsEl.addEventListener('click', function (e) {
    var copyBtn = e.target.closest('[data-copy]');
    var shareBtn = e.target.closest('[data-share]');
    var copyAll = e.target.closest('#btnCopyAll');

    if (copyBtn) {
      var i = Number(copyBtn.getAttribute('data-copy'));
      var r = lastResults[i];
      if (!r || !r.ok) return;
      copyText(r.url).then(function (ok) {
        if (ok) {
          copyBtn.classList.add('copied');
          var label = copyBtn.innerHTML;
          copyBtn.textContent = '복사했어요 ✓';
          setTimeout(function () { copyBtn.classList.remove('copied'); copyBtn.innerHTML = label; }, 1600);
          toast('깨끗한 링크를 복사했어요');
        } else {
          toast('복사가 막혔어요. 주소를 길게 눌러 직접 복사해 주세요');
        }
      });
      return;
    }
    if (shareBtn) {
      var j = Number(shareBtn.getAttribute('data-share'));
      var r2 = lastResults[j];
      if (r2 && r2.ok) shareText(r2.url);
      return;
    }
    if (copyAll) {
      var all = lastResults.filter(function (x) { return x.ok; }).map(function (x) { return x.url; }).join('\n');
      copyText(all).then(function (ok) {
        toast(ok ? '링크 ' + lastResults.filter(function (x) { return x.ok; }).length + '개를 복사했어요' : '복사가 막혔어요');
      });
    }
  });

  $('#btnClean').addEventListener('click', function () { runClean(false); });

  $('#btnPaste').addEventListener('click', function () {
    var read = (navigator.clipboard && navigator.clipboard.readText)
      ? navigator.clipboard.readText()
      : Promise.reject(new Error('no clipboard'));

    read.then(function (text) {
      if (text && text.trim()) {
        rawEl.value = text.trim();
        runClean(false);
      } else {
        rawEl.value = '';
        rawEl.focus();
        toast('클립보드가 비어 있어요. 링크를 복사한 뒤 다시 눌러 주세요');
      }
    }).catch(function () {
      rawEl.focus();
      toast('클립보드를 읽을 수 없어요. 입력창을 길게 눌러 붙여넣어 주세요');
    });
  });

  rawEl.addEventListener('paste', function () {
    setTimeout(function () {
      if (extractUrls(rawEl.value).length) runClean(true);
    }, 40);
  });

  var inputTimer = null;
  rawEl.addEventListener('input', function () {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(function () {
      if (extractUrls(rawEl.value).length) runClean(true);
      else { resultsEl.innerHTML = ''; lastResults = []; }
    }, 550);
  });

  rawEl.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runClean(false);
    }
  });

  $('#examples').addEventListener('click', function (e) {
    var b = e.target.closest('[data-ex]');
    if (!b) return;
    var map = {
      ig: '인스타에서 링크 복사했어요 https://www.instagram.com/reel/CzXk9LrPq2A/?igsh=MTZxOHN2bWJqZ3k4bw%3D%3D&utm_source=ig_web_copy_link',
      th: 'https://www.threads.net/@kimminhan9/post/CzXk9LrPq2A?xmt=AQGzXf9u2Q3pLk&slof=1&utm_source=threads',
      cp: 'https://www.coupang.com/vp/products/7845129367?itemId=22334455661&vendorItemId=88990011223&src=1139000&spec=10305196&addtag=400&ctag=7845129367&lptag=AF1234567&itime=20261123094100&pageType=PRODUCT&pageValue=7845129367&wPcid=17123456789012&wRef=share&wTime=1712345678901&redirect=share&mcid=abc123&sharesource=share&style=share&q=%EC%BF%A0%ED%8C%A1'
    };
    var yt = 'https://youtu.be/dQw4w9WgXcQ?si=Kx9pQ2rTzLmNoPq&t=42&feature=share';
    rawEl.value = map[b.getAttribute('data-ex')] || yt;
    runClean(false);
  });

  $('#btnOptions').addEventListener('click', function () {
    var box = $('#options');
    try { box.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
    box.style.transition = 'box-shadow .3s';
    box.style.boxShadow = '0 0 0 3px rgba(82,184,255,.22)';
    setTimeout(function () { box.style.boxShadow = 'none'; }, 700);
  });

  var optItemId = $('#optItemId');
  var optTs = $('#optTs');
  (function restoreOpts() {
    try {
      var s = localStorage.getItem('link-cleaner-opts');
      if (s) {
        var o = JSON.parse(s);
        if (o && typeof o.dropItemIds === 'boolean') optItemId.checked = o.dropItemIds;
        if (o && typeof o.keepTs === 'boolean') optTs.checked = o.keepTs;
      }
    } catch (e) {}
  })();

  function saveOpts() {
    try {
      localStorage.setItem('link-cleaner-opts', JSON.stringify(currentOpts()));
    } catch (e) {}
    if (lastResults.length) {
      var opts = currentOpts();
      render(lastResults.map(function (r) {
        return r.ok ? analyzeUrl(r.input, opts) : r;
      }));
    }
  }
  optItemId.addEventListener('change', saveOpts);
  optTs.addEventListener('change', saveOpts);

  /* 폰에서 주소창 없이도 보기 좋게, textarea 높이 자동 조절 */
  rawEl.addEventListener('input', function () {
    rawEl.style.height = 'auto';
    rawEl.style.height = Math.min(Math.max(rawEl.scrollHeight, 104), 220) + 'px';
  });

  /* 테스트용 노출 (앱 동작에는 영향 없음) */
  window.__linkCleaner = {
    analyzeUrl: analyzeUrl,
    extractUrls: extractUrls,
    siteRule: siteRule,
    version: 2
  };

  /* ---------- 공유 시트로 들어온 링크(?url=&text=&title=) 자동 정리 ---------- */
  (function handleShareTarget() {
    try {
      var q = new URLSearchParams(location.search || '');
      if (!q.has('url') && !q.has('text')) return;
      var text = (q.get('text') || '').trim();
      var url = (q.get('url') || '').trim();
      var combined = '';
      if (url && text && text.indexOf(url) === -1) combined = text + '\n' + url;
      else combined = text || url;
      if (!combined) return;
      rawEl.value = combined;
      runClean(false);
      // 새로고침해도 같은 링크를 다시 처리하지 않도록 주소창의 공유 파라미터만 지운다.
      if (history.replaceState) history.replaceState(null, '', location.pathname + location.hash);
    } catch (e) {}
  })();

  /* ---------- 홈 화면 설치용 서비스 워커 (오프라인 실행) ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
